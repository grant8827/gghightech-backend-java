# Message bodies and attachments are stored in PostgreSQL, alongside the rest
# of James's data. This server only sends, so blobs live just until delivery
# (seconds to a couple of days with retries); no object storage is needed.
# To move bodies to S3-compatible storage later (e.g. Hetzner Object Storage
# for real mailboxes), switch implementation to s3 and add the s3.* settings.
implementation=postgres
