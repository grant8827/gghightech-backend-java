# Production: James stores everything in a dedicated "james" database on the
# Railway PostgreSQL instance, reached over Railway's public TCP proxy.
# See DEPLOYMENT.md, "Storage". The ${...} placeholders are filled from
# /etc/james/james.env at install time:
#   set -a; . /etc/james/james.env; set +a
#   envsubst < postgres.properties > /opt/james/conf/postgres.properties
#   chmod 640 /opt/james/conf/postgres.properties; chown root:james /opt/james/conf/postgres.properties

# The "james" database, separate from the app's "railway" database.
database.name=james
database.schema=public

# Railway TCP proxy for the Postgres service: RAILWAY_TCP_PROXY_DOMAIN / _PORT
# (e.g. xxx.proxy.rlwy.net and a random port, not 5432).
database.host=${JAMES_DB_HOST}
database.port=${JAMES_DB_PORT}

# Dedicated role that can only use the "james" database.
database.username=james
database.password=${JAMES_DB_PASSWORD}

row.level.security.enabled=false

# Railway Postgres allows about 100 connections in total, shared with FastAPI
# and the Java service. Keep James's pool small.
pool.initial.size=5
pool.max.size=10
by-pass-rls.pool.initial.size=2
by-pass-rls.pool.max.size=5

# The connection crosses the internet: TLS is mandatory. Railway uses a
# self-signed certificate, so "require" (encrypted) rather than "verify-full".
ssl.mode=require

# Fail fast instead of hanging if Railway is briefly unreachable; James keeps
# retrying queued mail.
jooq.reactive.timeout=10second
